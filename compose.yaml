services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearmacro_provider}
      POSTGRES_USER: ${POSTGRES_USER:-clearmacro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearmacro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearmacro} -d ${POSTGRES_DB:-clearmacro_provider}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

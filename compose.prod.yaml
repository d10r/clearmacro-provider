services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      DATABASE_PATH: ${DATABASE_PATH:-/data/clearmacro-provider.sqlite}
      REGISTRY_PATH: ${REGISTRY_PATH:-/app/config/registry.json}
      OZ_RELAYER_URL: ${OZ_RELAYER_URL:-http://oz-relayer:8080}
      OZ_RELAYER_API_KEY: ${OZ_RELAYER_API_KEY:?set OZ_RELAYER_API_KEY}
      PROVIDER_NAME: ${PROVIDER_NAME:?set PROVIDER_NAME}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      RELAYER_WORKER_ENABLED: ${RELAYER_WORKER_ENABLED:-true}
      RELAYER_WORKER_POLL_INTERVAL_MS: ${RELAYER_WORKER_POLL_INTERVAL_MS:-2000}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_CLIENTS_JSON: ${API_CLIENTS_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      oz-relayer:
        condition: service_started
    volumes:
      - ./config/registry.json:/app/config/registry.json:ro
      - app-data:/data

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - oz-redis-data:/data

  oz-relayer:
    image: openzeppelin/openzeppelin-relayer:${OZ_RELAYER_VERSION:-v1.4.0}
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      APP_PORT: 8080
      METRICS_PORT: 8081
      METRICS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      REPOSITORY_STORAGE_TYPE: ${OZ_REPOSITORY_STORAGE_TYPE:-redis}
      RESET_STORAGE_ON_START: ${OZ_RESET_STORAGE_ON_START:-false}
      STORAGE_ENCRYPTION_KEY: ${OZ_STORAGE_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      API_KEY: ${OZ_RELAYER_API_KEY:?set OZ_RELAYER_API_KEY}
      WEBHOOK_SIGNING_KEY: ${OZ_WEBHOOK_SIGNING_KEY:?set OZ_WEBHOOK_SIGNING_KEY}
      KEYSTORE_PASSPHRASE: ${OZ_KEYSTORE_PASSPHRASE:?set OZ_KEYSTORE_PASSPHRASE}
      LOG_LEVEL: ${OZ_LOG_LEVEL:-info}
      IN_DOCKER: "true"
    volumes:
      - ./config/oz-relayer:/app/config:ro

volumes:
  app-data:
  oz-redis-data:
